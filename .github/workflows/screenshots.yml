name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web_console/**"
      - "tools/screenshots/**"

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    name: Build web and shoot screens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Сборка web
        working-directory: apps/web_console
        run: flutter build web --release

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Playwright
        working-directory: tools/screenshots
        run: |
          npm init -y
          npm install playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Скриншоты
        working-directory: tools/screenshots
        run: node capture.cjs

      - name: Коммит скриншотов
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "docs: обновлены скриншоты консоли"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: ignore
