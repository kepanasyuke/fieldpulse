name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web_console/**"

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    name: Golden screens and GIF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Рендер экранов движком Flutter
        working-directory: apps/web_console
        run: flutter test --update-goldens test/screenshot_test.dart

      - name: Копируем кадры в docs
        run: |
          mkdir -p docs/screenshots
          cp apps/web_console/test/goldens/*.png docs/screenshots/

      - name: Собираем GIF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cd docs/screenshots
          ffmpeg -y -framerate 1 -i console-frame-%d.png \
            -vf "scale=1200:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" \
            console-demo.gif

      - name: Коммит
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "docs: скриншоты и гифка консоли"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: ignore
