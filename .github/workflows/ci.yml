name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Версия Flutter и Dart
        run: flutter --version

      - name: Зависимости
        run: flutter pub get

      - name: Кодогенерация Retrofit
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Анализатор
        run: flutter analyze

      - name: Тесты
        run: flutter test --coverage

      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed $(git ls-files lib test | grep '\.dart$')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  monorepo:
    name: Packages & labs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Зависимости workspace
        run: flutter pub get

      - name: Анализатор пакетов
        run: |
          for dir in packages/*/; do
            echo "::group::$dir"
            (cd "$dir" && dart analyze)
            echo "::endgroup::"
          done

      - name: Анализатор и тесты лабораторий
        run: |
          for dir in labs/*/; do
            echo "::group::$dir"
            (cd "$dir" && flutter analyze && flutter test)
            echo "::endgroup::"
          done

  functions:
    name: Cloud Functions build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Сборка TypeScript
        run: npm run build

  web:
    name: Web console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Анализатор и тесты консоли
        working-directory: apps/web_console
        run: flutter analyze && flutter test --exclude-tags golden
      - name: Сборка web
        working-directory: apps/web_console
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-console
          path: apps/web_console/build/web
