name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Р’РµСЂСЃРёСЏ Flutter Рё Dart
        run: flutter --version

      - name: Р—Р°РІРёСЃРёРјРѕСЃС‚Рё
        run: flutter pub get

      - name: РљРѕРґРѕРіРµРЅРµСЂР°С†РёСЏ Retrofit
        run: dart run build_runner build --delete-conflicting-outputs

      - name: РђРЅР°Р»РёР·Р°С‚РѕСЂ
        run: flutter analyze

      - name: Р’Р»РѕР¶РµРЅРЅРѕСЃС‚СЊ СѓРїСЂР°РІР»СЏСЋС‰РёС… РєРѕРЅСЃС‚СЂСѓРєС†РёР№
        run: python3 tool/check_depth.py --max 2

      - name: Р’Р»РѕР¶РµРЅРЅРѕСЃС‚СЊ (РЅРµ Р±РѕР»СЊС€Рµ 3)
        run: python3 tool/check_depth.py --max 2

      - name: РўРµСЃС‚С‹
        run: flutter test --coverage

      - name: Р¤РѕСЂРјР°С‚РёСЂРѕРІР°РЅРёРµ
        run: dart format --output=none --set-exit-if-changed $(git ls-files lib test | grep '\.dart$')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  monorepo:
    name: Packages & labs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Р—Р°РІРёСЃРёРјРѕСЃС‚Рё workspace
        run: flutter pub get

      - name: РђРЅР°Р»РёР·Р°С‚РѕСЂ РїР°РєРµС‚РѕРІ
        run: |
          for dir in packages/*/; do
            echo "::group::$dir"
            (cd "$dir" && dart analyze)
            echo "::endgroup::"
          done

      - name: РђРЅР°Р»РёР·Р°С‚РѕСЂ Рё С‚РµСЃС‚С‹ Р»Р°Р±РѕСЂР°С‚РѕСЂРёР№
        run: |
          for dir in labs/*/; do
            echo "::group::$dir"
            (cd "$dir" && flutter analyze && flutter test)
            echo "::endgroup::"
          done

  functions:
    name: Cloud Functions build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Р—Р°РІРёСЃРёРјРѕСЃС‚Рё
        run: npm install --no-audit --no-fund

      - name: РЎР±РѕСЂРєР° TypeScript
        run: npm run build

  web:
    name: Web console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: РђРЅР°Р»РёР·Р°С‚РѕСЂ Рё С‚РµСЃС‚С‹ РєРѕРЅСЃРѕР»Рё
        working-directory: apps/web_console
        run: flutter analyze && flutter test --exclude-tags golden
      - name: РЎР±РѕСЂРєР° web
        working-directory: apps/web_console
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-console
          path: apps/web_console/build/web
