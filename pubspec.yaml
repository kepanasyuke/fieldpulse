  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # native capabilities
  local_auth: ^2.3.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2

  # firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
